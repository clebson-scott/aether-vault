[package]
name = "aether-vault"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Aether Vault - Living Shared Vaults: cofres vivos compartilhados na Arbitrum"
authors = ["Clebson Campos de Araujo"]

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.9"

[dev-dependencies]
hex = "0.4"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = 3
